<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuthPage Component Test - Fixed</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM from CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        /* Clean white page styles */
        .content-wrapper {
            position: relative;
            background: white;
            z-index: 10;
        }

        /* Bubble Effect Styles */
        .bubble-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }
        
        .bubble {
            position: absolute;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.6), rgba(147, 51, 234, 0.5));
            border-radius: 50%;
            opacity: 1;
            animation: float 8s ease-in-out infinite;
            backdrop-filter: blur(2px);
            border: 2px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.3), inset 0 2px 10px rgba(255, 255, 255, 0.2);
        }
        
        .bubble:nth-child(1) {
            width: 50px;
            height: 50px;
            left: 10%;
            animation-duration: 8s;
            animation-delay: -1s;
        }
        
        .bubble:nth-child(2) {
            width: 35px;
            height: 35px;
            left: 20%;
            animation-duration: 6s;
            animation-delay: -2s;
        }
        
        .bubble:nth-child(3) {
            width: 60px;
            height: 60px;
            left: 35%;
            animation-duration: 10s;
            animation-delay: -4s;
        }
        
        .bubble:nth-child(4) {
            width: 40px;
            height: 40px;
            left: 50%;
            animation-duration: 7s;
            animation-delay: -1.5s;
        }
        
        .bubble:nth-child(5) {
            width: 55px;
            height: 55px;
            left: 70%;
            animation-duration: 9s;
            animation-delay: -3s;
        }
        
        .bubble:nth-child(6) {
            width: 45px;
            height: 45px;
            left: 85%;
            animation-duration: 8s;
            animation-delay: -0.5s;
        }
        
        .bubble:nth-child(7) {
            width: 30px;
            height: 30px;
            left: 15%;
            animation-duration: 5s;
            animation-delay: -2.5s;
        }
        
        .bubble:nth-child(8) {
            width: 65px;
            height: 65px;
            left: 65%;
            animation-duration: 11s;
            animation-delay: -4.5s;
        }
        
        @keyframes float {
            0% {
                transform: translateY(100vh) translateX(0px) rotate(0deg) scale(0.8);
                opacity: 0;
            }
            10% {
                opacity: 0.9;
                transform: translateY(90vh) translateX(5px) rotate(36deg) scale(1);
            }
            50% {
                transform: translateY(50vh) translateX(25px) rotate(180deg) scale(1.1);
                opacity: 0.9;
            }
            90% {
                opacity: 0.9;
                transform: translateY(10vh) translateX(45px) rotate(324deg) scale(1);
            }
            100% {
                transform: translateY(-100px) translateX(50px) rotate(360deg) scale(0.8);
                opacity: 0;
            }
        }
        
        /* Additional subtle bubbles */
        .bubble-small {
            position: absolute;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(59, 130, 246, 0.2));
            border-radius: 50%;
            opacity: 0.7;
            animation: float-slow 15s ease-in-out infinite;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.1);
        }
        
        .bubble-small:nth-child(odd) {
            animation-direction: reverse;
        }
        
        /* Left side bubbles with different gradient */
        .bubble-left {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.3), rgba(59, 130, 246, 0.2)) !important;
            animation-name: float-left !important;
            border: 1px solid rgba(16, 185, 129, 0.1) !important;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.15) !important;
        }
        
        /* Right side bubbles with different gradient */
        .bubble-right {
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.3), rgba(236, 72, 153, 0.2)) !important;
            animation-name: float-right !important;
            border: 1px solid rgba(147, 51, 234, 0.1) !important;
            box-shadow: 0 4px 15px rgba(147, 51, 234, 0.15) !important;
        }
        
        @keyframes float-left {
            0% {
                transform: translateY(100vh) translateX(-20px) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-100px) translateX(30px) rotate(-360deg);
                opacity: 0;
            }
        }
        
        @keyframes float-right {
            0% {
                transform: translateY(100vh) translateX(20px) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-100px) translateX(-30px) rotate(360deg);
                opacity: 0;
            }
        }
        
        @keyframes float-slow {
            0%, 100% {
                transform: translateY(100vh) translateX(0px);
                opacity: 0;
            }
            50% {
                transform: translateY(50vh) translateX(30px);
                opacity: 0.5;
            }
        }
        
        /* Enhanced main container */
        .main-content {
            position: relative;
            z-index: 10;
        }
        
        /* Ensure proper layering */
        .bg-white {
            position: relative;
            z-index: 20;
        }

    </style>
</head>
<body>
    <!-- Floating Bubbles Background -->
    <div class="bubble-container">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        
        <!-- Left side bubbles -->
        <div class="bubble bubble-left" style="width: 40px; height: 40px; left: 5%; animation-delay: -3s; animation-duration: 9s;"></div>
        <div class="bubble bubble-left" style="width: 55px; height: 55px; left: 8%; animation-delay: -7s; animation-duration: 12s;"></div>
        <div class="bubble bubble-left" style="width: 32px; height: 32px; left: 3%; animation-delay: -1s; animation-duration: 7s;"></div>
        <div class="bubble bubble-left" style="width: 48px; height: 48px; left: 12%; animation-delay: -5s; animation-duration: 10s;"></div>
        
        <!-- Right side bubbles -->
        <div class="bubble bubble-right" style="width: 38px; height: 38px; left: 92%; animation-delay: -2s; animation-duration: 8s;"></div>
        <div class="bubble bubble-right" style="width: 52px; height: 52px; left: 88%; animation-delay: -6s; animation-duration: 11s;"></div>
        <div class="bubble bubble-right" style="width: 42px; height: 42px; left: 95%; animation-delay: -4s; animation-duration: 9s;"></div>
        <div class="bubble bubble-right" style="width: 35px; height: 35px; left: 90%; animation-delay: -8s; animation-duration: 6s;"></div>
        
        <!-- Small additional bubbles -->
        <div class="bubble-small" style="width: 25px; height: 25px; left: 25%; animation-delay: -6s;"></div>
        <div class="bubble-small" style="width: 30px; height: 30px; left: 45%; animation-delay: -8s;"></div>
        <div class="bubble-small" style="width: 20px; height: 20px; left: 75%; animation-delay: -10s;"></div>
        <div class="bubble-small" style="width: 28px; height: 28px; left: 90%; animation-delay: -12s;"></div>
        
        <!-- Additional small bubbles for left/right -->
        <div class="bubble-small" style="width: 22px; height: 22px; left: 7%; animation-delay: -14s;"></div>
        <div class="bubble-small" style="width: 18px; height: 18px; left: 93%; animation-delay: -16s;"></div>
    </div>

    <!-- Clean White Page -->
    <div id="root" class="main-content"></div>

    <script type="text/babel">
        const { useState } = React;

        const AuthPage = () => {
          const [activeTab, setActiveTab] = useState('signin');
          const [loading, setLoading] = useState(false);
          const [formData, setFormData] = useState({
            name: '',
            email: '',
            password: '',
            confirmPassword: ''
          });

          const handleInputChange = (e) => {
            const { name, value } = e.target;
            setFormData(prev => ({
              ...prev,
              [name]: value
            }));
          };

          const handleOAuth = async (provider) => {
            setLoading(true);
            console.log(`Initiating OAuth flow for ${provider}...`);
            await new Promise(resolve => setTimeout(resolve, 1000));
            console.log(`${provider} OAuth flow would redirect to: https://${provider}.com/oauth/authorize`);
            alert(`${provider} OAuth simulation complete!`);
            setLoading(false);
          };

          const handleSubmit = async (e) => {
            e.preventDefault();
            setLoading(true);
            
            if (activeTab === 'signup' && formData.password !== formData.confirmPassword) {
              alert('Passwords do not match');
              setLoading(false);
              return;
            }
            
            await new Promise(resolve => setTimeout(resolve, 1000));
            console.log(`${activeTab} successful`, formData);
            alert(`${activeTab} form submission successful!`);
            setLoading(false);
          };

          return (
            <div className="min-h-screen bg-gradient-to-br from-gray-50 to-blue-50 flex flex-col content-wrapper">
              {/* Navigation Bar */}
              <nav className="bg-white/90 backdrop-blur-sm shadow-sm border-b border-gray-200 relative z-10">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                  <div className="flex justify-between items-center h-16">
                    <div className="flex items-center">
                      <h1 className="text-xl font-bold text-gray-900">AuthFlow</h1>
                    </div>
                    <div className="hidden md:block">
                      <div className="ml-10 flex items-baseline space-x-4">
                        <a href="#" className="text-gray-500 hover:text-gray-700 px-3 py-2 rounded-md text-sm font-medium">Home</a>
                        <a href="#" className="text-gray-500 hover:text-gray-700 px-3 py-2 rounded-md text-sm font-medium">Features</a>
                        <a href="#" className="text-gray-500 hover:text-gray-700 px-3 py-2 rounded-md text-sm font-medium">Pricing</a>
                        <a href="#" className="text-gray-500 hover:text-gray-700 px-3 py-2 rounded-md text-sm font-medium">About</a>
                      </div>
                    </div>
                  </div>
                </div>
              </nav>

              {/* Main Content */}
              <main className="flex-grow flex items-center justify-center px-4 py-8">
                <div className="w-full max-w-md">
                  <div className="bg-white/95 backdrop-blur-sm rounded-xl shadow-xl border border-white/20 overflow-hidden">
                    {/* Tab Header */}
                    <div className="flex border-b border-gray-200">
                      <button
                        onClick={() => setActiveTab('signin')}
                        className={`flex-1 py-4 px-6 text-sm font-medium transition-colors duration-200 ${
                          activeTab === 'signin'
                            ? 'bg-blue-50 text-blue-700 border-b-2 border-blue-700'
                            : 'text-gray-500 hover:text-gray-700 hover:bg-gray-50'
                        }`}
                      >
                        Sign In
                      </button>
                      <button
                        onClick={() => setActiveTab('signup')}
                        className={`flex-1 py-4 px-6 text-sm font-medium transition-colors duration-200 ${
                          activeTab === 'signup'
                            ? 'bg-blue-50 text-blue-700 border-b-2 border-blue-700'
                            : 'text-gray-500 hover:text-gray-700 hover:bg-gray-50'
                        }`}
                      >
                        Sign Up
                      </button>
                    </div>

                    {/* Form Content */}
                    <div className="p-8">
                      <div className="text-center mb-8">
                        <h1 className="text-2xl font-bold text-gray-900 mb-2">
                          {activeTab === 'signin' ? 'Welcome back' : 'Create your account'}
                        </h1>
                        <p className="text-gray-600">
                          {activeTab === 'signin' 
                            ? 'Sign in to your account to continue' 
                            : 'Join us and start your journey today'
                          }
                        </p>
                      </div>

                      {/* Social Login Buttons */}
                      <div className="space-y-3 mb-8">
                        <button
                          onClick={() => handleOAuth('instagram')}
                          disabled={loading}
                          className="w-full flex items-center justify-center gap-3 py-3 px-4 rounded-lg text-white font-medium bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-600 hover:to-pink-600 disabled:opacity-50"
                        >
                          📷 Continue with Instagram
                        </button>
                        <button
                          onClick={() => handleOAuth('facebook')}
                          disabled={loading}
                          className="w-full flex items-center justify-center gap-3 py-3 px-4 rounded-lg text-white font-medium bg-blue-600 hover:bg-blue-700 disabled:opacity-50"
                        >
                          📘 Continue with Facebook
                        </button>
                        <button
                          onClick={() => handleOAuth('twitter')}
                          disabled={loading}
                          className="w-full flex items-center justify-center gap-3 py-3 px-4 rounded-lg text-white font-medium bg-black hover:bg-gray-800 disabled:opacity-50"
                        >
                          🐦 Continue with X (Twitter)
                        </button>
                        <button
                          onClick={() => handleOAuth('linkedin')}
                          disabled={loading}
                          className="w-full flex items-center justify-center gap-3 py-3 px-4 rounded-lg text-white font-medium bg-blue-700 hover:bg-blue-800 disabled:opacity-50"
                        >
                          💼 Continue with LinkedIn
                        </button>
                        <button
                          onClick={() => handleOAuth('youtube')}
                          disabled={loading}
                          className="w-full flex items-center justify-center gap-3 py-3 px-4 rounded-lg text-white font-medium bg-red-600 hover:bg-red-700 disabled:opacity-50"
                        >
                          📺 Continue with YouTube
                        </button>
                      </div>

                      {/* Divider */}
                      <div className="relative mb-8">
                        <div className="absolute inset-0 flex items-center">
                          <div className="w-full border-t border-gray-300" />
                        </div>
                        <div className="relative flex justify-center text-sm">
                          <span className="px-4 bg-white text-gray-500">Or continue with email</span>
                        </div>
                      </div>

                      {/* Email/Password Form */}
                      <form onSubmit={handleSubmit} className="space-y-4">
                        {activeTab === 'signup' && (
                          <div>
                            <label htmlFor="name" className="block text-sm font-medium text-gray-700 mb-2">
                              Full Name
                            </label>
                            <input
                              id="name"
                              name="name"
                              type="text"
                              required
                              value={formData.name}
                              onChange={handleInputChange}
                              className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                              placeholder="Enter your full name"
                            />
                          </div>
                        )}

                        <div>
                          <label htmlFor="email" className="block text-sm font-medium text-gray-700 mb-2">
                            Email Address
                          </label>
                          <input
                            id="email"
                            name="email"
                            type="email"
                            required
                            value={formData.email}
                            onChange={handleInputChange}
                            className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                            placeholder="Enter your email"
                          />
                        </div>

                        <div>
                          <label htmlFor="password" className="block text-sm font-medium text-gray-700 mb-2">
                            Password
                          </label>
                          <input
                            id="password"
                            name="password"
                            type="password"
                            required
                            value={formData.password}
                            onChange={handleInputChange}
                            className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                            placeholder="Enter your password"
                          />
                        </div>

                        {activeTab === 'signup' && (
                          <div>
                            <label htmlFor="confirmPassword" className="block text-sm font-medium text-gray-700 mb-2">
                              Confirm Password
                            </label>
                            <input
                              id="confirmPassword"
                              name="confirmPassword"
                              type="password"
                              required
                              value={formData.confirmPassword}
                              onChange={handleInputChange}
                              className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                              placeholder="Confirm your password"
                            />
                          </div>
                        )}

                        {activeTab === 'signin' && (
                          <div className="flex justify-end">
                            <button
                              type="button"
                              className="text-sm text-blue-600 hover:text-blue-800 font-medium"
                            >
                              Forgot password?
                            </button>
                          </div>
                        )}

                        <button
                          type="submit"
                          disabled={loading}
                          className="w-full bg-blue-600 text-white py-3 px-4 rounded-lg font-medium hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed"
                        >
                          {loading ? 'Processing...' : (activeTab === 'signin' ? 'Sign In' : 'Create Account')}
                        </button>
                      </form>

                      {activeTab === 'signup' && (
                        <p className="mt-6 text-xs text-gray-500 text-center">
                          By signing up, you agree to our{' '}
                          <button className="text-blue-600 hover:text-blue-800 font-medium">Terms of Service</button>{' '}
                          and{' '}
                          <button className="text-blue-600 hover:text-blue-800 font-medium">Privacy Policy</button>
                        </p>
                      )}
                    </div>
                  </div>

                  <div className="mt-6 text-center">
                    <p className="text-sm text-gray-600">
                      {activeTab === 'signin' ? "Don't have an account? " : "Already have an account? "}
                      <button
                        onClick={() => setActiveTab(activeTab === 'signin' ? 'signup' : 'signin')}
                        className="text-blue-600 hover:text-blue-800 font-medium"
                      >
                        {activeTab === 'signin' ? 'Sign up' : 'Sign in'}
                      </button>
                    </p>
                  </div>
                </div>
              </main>

              {/* Footer */}
              <footer className="bg-white border-t border-gray-200 mt-auto">
                <div className="max-w-7xl mx-auto py-12 px-4 sm:px-6 lg:px-8">
                  <div className="grid grid-cols-1 md:grid-cols-4 gap-8">
                    <div className="col-span-1 md:col-span-2">
                      <h2 className="text-lg font-bold text-gray-900 mb-4">AuthFlow</h2>
                      <p className="text-gray-600 text-sm mb-4">
                        Secure, modern authentication made simple. Connect with your favorite social platforms or use traditional email sign-up.
                      </p>
                      <div className="flex space-x-4">
                        <a href="#" className="text-gray-400 hover:text-gray-600">🐦 Twitter</a>
                        <a href="#" className="text-gray-400 hover:text-gray-600">📘 GitHub</a>
                        <a href="#" className="text-gray-400 hover:text-gray-600">💼 LinkedIn</a>
                      </div>
                    </div>
                    
                    <div>
                      <h3 className="text-sm font-semibold text-gray-900 tracking-wider uppercase mb-4">Quick Links</h3>
                      <ul className="space-y-2">
                        <li><a href="#" className="text-gray-600 hover:text-gray-900 text-sm">Home</a></li>
                        <li><a href="#" className="text-gray-600 hover:text-gray-900 text-sm">Features</a></li>
                        <li><a href="#" className="text-gray-600 hover:text-gray-900 text-sm">Documentation</a></li>
                        <li><a href="#" className="text-gray-600 hover:text-gray-900 text-sm">API Reference</a></li>
                      </ul>
                    </div>
                    
                    <div>
                      <h3 className="text-sm font-semibold text-gray-900 tracking-wider uppercase mb-4">Support</h3>
                      <ul className="space-y-2">
                        <li><a href="#" className="text-gray-600 hover:text-gray-900 text-sm">Help Center</a></li>
                        <li><a href="#" className="text-gray-600 hover:text-gray-900 text-sm">Contact Us</a></li>
                        <li><a href="#" className="text-gray-600 hover:text-gray-900 text-sm">Privacy Policy</a></li>
                        <li><a href="#" className="text-gray-600 hover:text-gray-900 text-sm">Terms of Service</a></li>
                      </ul>
                    </div>
                  </div>
                  
                  <div className="mt-8 pt-8 border-t border-gray-200">
                    <div className="flex flex-col md:flex-row justify-between items-center">
                      <p className="text-gray-500 text-sm mb-4 md:mb-0">
                        © 2025 AuthFlow. All rights reserved.
                      </p>
                      <div className="flex items-center space-x-4">
                        <span className="text-gray-500 text-sm">🔒 Secured by SSL</span>
                        <span className="text-gray-500 text-sm">⭐ Enterprise Grade</span>
                      </div>
                    </div>
                  </div>
                </div>
              </footer>
            </div>
          );
        };

        // Render the component
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AuthPage />);

        console.log('🚀 AuthPage Component Loaded Successfully!');
        console.log('📋 Test the component: toggle tabs, fill forms, click OAuth buttons');
        console.log('✨ Enhanced with beautiful floating bubble effects!');
    </script>
</body>
</html>
